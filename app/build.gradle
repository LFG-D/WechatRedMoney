plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.xros.wechatredmoney'
    compileSdk 36

    defaultConfig {
        applicationId "com.xros.wechatredmoney"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 只保留 64 位 ARM，减小 ML Kit 带来的安装包体积
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "lfg_${variant.buildType.name}_${buildTime()}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

def buildTime() {
    new Date().format("yyyyMMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
}